{% extends 'boards/base.html' %}

{% block title %}Eliminar Tarea | Gestor de Tareas{% endblock title %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>¿Eliminar la tarea "{{ object.title }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #eb5a46;">Sí, eliminar</button>
        <a href="{% url 'boards:board_detail' object.task_list.board.pk %}" style="margin-left: 1rem; color: #5e6c84; text-decoration: none;">Cancelar</a>
    </form>
</div>
{% endblock content %}
