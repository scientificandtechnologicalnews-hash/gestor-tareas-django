<!-- boards/templates/registration/register.html -->
{% extends 'boards/base.html' %}

{% block title %}Crear Cuenta | Gestor de Tareas{% endblock title %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h2>Registro de Usuario</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%;">Crear mi cuenta</button>
    </form>
    
    <p style="margin-top: 1.5rem; font-size: 0.9rem; text-align: center;">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
    </p>
</div>
{% endblock content %}
